<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservas | Centro de Endoscopia</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container">
      <div class="logo">
        <span class="icon">🩺</span>
        <div>
          <h1>Centro de Endoscopia</h1>
          <p>Sistema de Reservas</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Vista Calendario -->
    <section id="calendar-view">
      <div class="calendar-header">
        <button id="prev-month" class="btn-nav">‹</button>
        <h2 id="month-year"></h2>
        <button id="next-month" class="btn-nav">›</button>
      </div>

      <div class="weekdays">
        <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
      </div>

      <div id="calendar-days" class="days"></div>

      <div class="legend">
        <span><i class="dot available"></i> Disponible</span>
        <span><i class="dot partial"></i> Parcial</span>
        <span><i class="dot full"></i> Completo</span>
        <span><i class="dot past"></i> Pasado</span>
      </div>
    </section>

    <!-- Vista de Turnos del día -->
    <section id="slots-view" class="hidden">
      <button id="back-to-calendar" class="btn-back">← Volver al calendario</button>
      <h2 id="selected-date-title"></h2>
      <p class="subtitle">Seleccione un turno disponible</p>

      <div id="slots-container" class="slots"></div>
    </section>

    <!-- Formulario de reserva -->
    <section id="form-view" class="hidden">
      <button id="back-to-slots" class="btn-back">← Cambiar turno</button>
      <h2>Datos del Paciente</h2>
      <p class="subtitle" id="form-slot-info"></p>

      <form id="reservation-form">
        <div class="form-group">
          <label for="nombre">Nombre completo *</label>
          <input type="text" id="nombre" required placeholder="Ej. María González López" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="documento">Documento de identidad *</label>
            <input type="text" id="documento" required placeholder="Cédula / DNI" />
          </div>
          <div class="form-group">
            <label for="telefono">Teléfono / WhatsApp *</label>
            <input type="tel" id="telefono" required placeholder="+57 300 123 4567" />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="paciente@email.com" />
        </div>

        <div class="form-group">
          <label for="procedimiento">Tipo de procedimiento *</label>
          <select id="procedimiento" required>
            <option value="">Seleccione...</option>
            <option value="Endoscopia digestiva alta">Endoscopia digestiva alta</option>
            <option value="Colonoscopia">Colonoscopia</option>
            <option value="Endoscopia + Colonoscopia">Endoscopia + Colonoscopia</option>
            <option value="Gastroscopia">Gastroscopia</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="notas">Observaciones / Motivo de consulta</label>
          <textarea id="notas" rows="3" placeholder="Alergias, medicamentos, preparación especial..."></textarea>
        </div>

        <button type="submit" class="btn-primary">Confirmar Reserva</button>
      </form>
    </section>

    <!-- Confirmación -->
    <section id="success-view" class="hidden">
      <div class="success-card">
        <div class="success-icon">✓</div>
        <h2>¡Reserva confirmada!</h2>
        <p id="success-details"></p>
        <button id="new-reservation" class="btn-primary">Nueva reserva</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Centro de Endoscopia · Sistema de Reservas</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
